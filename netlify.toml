[build]
command = "npm run build:netlify"
publish = ".next"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--no-audit"

[context.production]
command = "npm run build:netlify"

[context.production.environment]
NEXT_PUBLIC_SITE_URL = "https://therealart.in"
